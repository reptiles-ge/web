changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New
      labels:
        - enhancement
    - title: Content
      labels:
        - content
    - title: Fixes
      labels:
        - bug
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
