name: Warm cache

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore the last URLs sent to IndexNow
        uses: actions/cache/restore@v6
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      - name: Wait for the deploy, request every sitemap URL, submit changed URLs to IndexNow
        run: node scripts/warm-cache.mjs --indexnow-state .indexnow-state.json --wait-for-deploy ${{ github.event_name == 'push' && '900' || '0' }}

      - name: Save the URLs sent to IndexNow
        if: ${{ !cancelled() && hashFiles('.indexnow-state.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
