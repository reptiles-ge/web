name: Warm cache

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore the last URLs sent to IndexNow
        uses: actions/cache/restore@v6
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      - name: Wait for the deploy, request every sitemap URL, submit changed URLs to IndexNow
        run: node scripts/warm-cache.mjs --indexnow-state .indexnow-state.json --wait-for-deploy ${{ github.event_name == 'push' && '900' || '0' }}

      - name: Save the URLs sent to IndexNow
        if: ${{ !cancelled() && hashFiles('.indexnow-state.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Upload missing OG images and news schema crops
        run: pnpm images:warm
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
          BUNNY_STORAGE_REGION: ${{ secrets.BUNNY_STORAGE_REGION }}

      - name: Open a pull request with the updated news schema manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/newsSchemaImages.json; then
            echo "newsSchemaImages.json is unchanged."
            exit 0
          fi
          branch=bot/news-schema-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add src/data/newsSchemaImages.json
          git commit -m "Record new news schema crops"
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --base staging --state open --json number --jq length)" = "0" ]; then
            gh pr create --base staging --head "$branch" --label content \
              --title "Record new news schema crops" \
              --body "The warm-cache workflow uploaded 16:9, 4:3 and 1:1 crops for new news heroes. This records them in \`src/data/newsSchemaImages.json\`, so NewsArticle JSON-LD lists them after the next deploy."
          fi
