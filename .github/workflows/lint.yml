name: Lint

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm species:compile

      - run: pnpm search:compile

      - run: pnpm knip

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          nohup pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready"
          cat /tmp/next-start.log
          exit 1

      - run: pnpm test:e2e
        env:
          PW_REUSE_SERVER: "1"

      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          urls: |
            http://127.0.0.1:3000/
            http://127.0.0.1:3000/gvelebi/giurza
            http://127.0.0.1:3000/en/snakes/macrovipera-lebetina
